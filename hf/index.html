<!doctype html>
<!-- Omni Video Director — HyperFrames assembly composition.
     Base = the (already Omni'd + voiced) beat clip on track 0.
     Overlays (animated graphics HyperFrames does that Omni/GPT-Image can't) go on their own tracks.
     Render: npx hyperframes render hf -o hf/out.mp4 -q draft   (see the `assemble` skill). -->
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=720, height=1280"/>
<script src="gsap.min.js"></script>
<link href="kit.css" rel="stylesheet"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:720px;height:1280px;overflow:hidden;background:var(--ink);font-family:var(--body)}
  .statcard{position:absolute;left:60px;right:60px;top:150px;display:flex;justify-content:center;gap:0;
    background:rgba(14,20,24,.86);border:2px solid var(--coral);border-radius:20px;padding:22px 10px;
    box-shadow:0 0 40px rgba(255,106,69,.35);backdrop-filter:blur(4px);opacity:0}
  .stat{flex:1;text-align:center;position:relative}
  .stat + .stat::before{content:"";position:absolute;left:0;top:12%;height:76%;width:1px;background:rgba(255,255,255,.14)}
  .num{font-family:var(--head);font-weight:800;font-size:56px;color:var(--white);line-height:1;font-variant-numeric:tabular-nums}
  .lab{font-family:var(--body);font-weight:600;font-size:16px;color:var(--muted);margin-top:8px;letter-spacing:.02em}
  .kick{position:absolute;top:-30px;left:0;right:0;text-align:center;font-family:var(--head);font-weight:700;
    font-size:15px;letter-spacing:.18em;color:var(--coral);text-transform:uppercase;opacity:0}
</style></head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="7.0" data-width="720" data-height="1280">

    <!-- BASE: the Omni'd + voiced beat clip -->
    <video id="base" class="clip" data-start="0" data-duration="7.0" data-track-index="0"
           src="assets/base.mp4" muted
           style="position:absolute;inset:0;width:720px;height:1280px;object-fit:cover"></video>
    <!-- the clip carries its own audio track separately (HyperFrames plays it) -->
    <audio class="clip" data-start="0" data-duration="7.0" data-track-index="5" data-volume="1" src="assets/base.mp4"></audio>

    <!-- OVERLAY (track 1): animated stat count-up — the thing Omni/GPT-Image can't do -->
    <div id="card" class="clip statcard" data-start="4.30" data-duration="2.70" data-track-index="1">
      <div class="kick" id="kick">MADE WITHOUT AN EDITOR</div>
      <div class="stat"><div class="num" id="n0">0</div><div class="lab">editors</div></div>
      <div class="stat"><div class="num" id="n1">0</div><div class="lab">prompt</div></div>
      <div class="stat"><div class="num" id="n2">0%</div><div class="lab">AI-made</div></div>
    </div>

  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    // card slides + fades in at 4.3s
    tl.fromTo("#card", {opacity:0, y:24}, {opacity:1, y:0, duration:.45, ease:"power2.out"}, 4.30);
    tl.fromTo("#kick", {opacity:0}, {opacity:1, duration:.4}, 4.55);
    // seek-safe count-ups (GSAP evaluates the tween value on every seek)
    const c0={v:0}, c2={v:0};
    tl.to(c0, {v:0,  duration:.01, onUpdate:()=>n0.textContent=Math.round(c0.v)}, 4.6);      // editors: 0
    tl.set("#n1", {}, 4.9); tl.call(()=>{n1.textContent="1";}, null, 4.9);                    // prompt: 1
    tl.to(c2, {v:100, duration:1.2, ease:"power1.out",
               onUpdate:()=>n2.textContent=Math.round(c2.v)+"%"}, 4.9);                        // AI-made: 0→100%
    window.__timelines["main"] = tl;
  </script>
</body></html>
